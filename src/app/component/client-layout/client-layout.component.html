<div class="min-h-screen bg-gray-50">
  <!-- Sidebar -->
  <aside [class.translate-x-0]="isSidebarOpen"
         [class.-translate-x-full]="!isSidebarOpen"
         class="fixed left-0 top-0 z-40 h-screen w-64 transition-transform duration-300 bg-secondary shadow-lg">

    <!-- Logo -->
    <div class="flex items-center justify-between h-16 px-6 border-b border-gray-700">
      <div class="flex items-center space-x-2">
        <i class="fas fa-briefcase text-primary text-2xl"></i>
        <span class="text-xl font-bold text-white">Espace Client</span>
      </div>
    </div>



    <!-- Navigation Menu -->
    <nav class="px-4 py-4 space-y-2">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.route"
         routerLinkActive="bg-primary text-white"
         [routerLinkActiveOptions]="{exact: true}"
         class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-all duration-200 cursor-pointer group">
        <i [class]="'fas ' + item.icon + ' text-xl'"></i>
        <span class="font-medium">{{ item.label }}</span>
      </a>
    </nav>


  </aside>

  <!-- Main Content -->
  <div [class.ml-64]="isSidebarOpen"
       [class.ml-0]="!isSidebarOpen"
       class="transition-all duration-300">

    <!-- Top Bar -->
    <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 sticky top-0 z-30">
      <button (click)="toggleSidebar()"
              class="text-gray-600 hover:text-primary transition-colors duration-200 lg:hidden">
        <i class="fas fa-bars text-2xl"></i>
      </button>

      <button (click)="toggleSidebar()"
              class="text-gray-600 hover:text-primary transition-colors duration-200 hidden lg:block">
        <i class="fas fa-bars text-2xl"></i>
      </button>

      <div class="flex items-center space-x-4">
        <span class="text-gray-600 hidden sm:inline">{{ currentUser?.email }}</span>
      </div>
    </header>

    <!-- Page Content -->
    <main class="p-4 sm:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
